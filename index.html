<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rizz Live — Host Policy</title>
<style>
  :root{
    --primary:#C84DFF;
    --secondary:#F78BFF;
    --bg:#FFF3FC;
    --light-purple:#E9D5FF;
    --lavender:#D9B8FF;
    --white:#FFFFFF;
    --gold:#FFD76A;
    --text:#2D2545;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{ height:100%; }
  body{
    font-family:'Poppins','Segoe UI',sans-serif;
    min-height:100vh;
    min-height:100dvh;
    margin:0;
    background:
      radial-gradient(circle at 15% 8%, rgba(200,77,255,0.28), transparent 42%),
      radial-gradient(circle at 92% 18%, rgba(247,139,255,0.32), transparent 46%),
      radial-gradient(circle at 25% 95%, rgba(217,184,255,0.38), transparent 48%),
      linear-gradient(160deg, var(--bg) 0%, var(--light-purple) 55%, var(--lavender) 100%);
  }

  .bokeh{
    position:fixed; border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,0.85), rgba(255,255,255,0) 70%);
    filter: blur(2px);
    animation: float 11s ease-in-out infinite;
    pointer-events:none;
    z-index:0;
  }
  @keyframes float{
    0%,100%{ transform: translateY(0px) scale(1); opacity:.6; }
    50%{ transform: translateY(-32px) scale(1.15); opacity:1; }
  }

  .app-screen{ display:none; min-height:100vh; min-height:100dvh; position:relative; z-index:1; }
  .app-screen.active{ display:flex; flex-direction:column; }

  .page{
    flex:1;
    display:flex;
    flex-direction:column;
    width:100%;
    max-width:560px;
    margin:0 auto;
    background: linear-gradient(160deg, rgba(255,255,255,0.35), rgba(255,255,255,0.08));
    box-shadow: 0 0 90px rgba(150,60,220,0.25);
    position:relative;
    overflow:hidden;
  }

  @media (min-width: 700px){
    .app-screen{ padding:32px 0; }
    .page{
      border-radius:36px;
      border:1px solid rgba(255,255,255,0.6);
      max-height:900px;
      backdrop-filter: blur(20px);
    }
  }

  .hero{
    position:relative;
    padding:clamp(20px,5vw,36px) clamp(18px,5vw,32px) clamp(22px,4vw,30px);
    flex-shrink:0;
    overflow:hidden;
  }
  .hero::after{
    content:"";
    position:absolute; top:-60px; right:-60px;
    width:180px; height:180px;
    border-radius:50%;
    background:rgba(255,255,255,0.12);
  }
  .hero::before{
    content:"";
    position:absolute; bottom:-40px; left:-30px;
    width:120px; height:120px;
    border-radius:50%;
    background:rgba(255,255,255,0.08);
  }

  .hero--index{
    background:
      linear-gradient(160deg, rgba(200,77,255,0.92), rgba(168,56,232,0.88) 55%, rgba(120,40,190,0.9)),
      radial-gradient(circle at 80% 0%, rgba(255,255,255,0.25), transparent 60%);
  }
  .hero--audio{
    padding-bottom:clamp(20px,4vw,28px);
    background:
      linear-gradient(160deg, rgba(160,110,255,0.92), rgba(140,80,235,0.9) 55%, rgba(100,50,190,0.92)),
      radial-gradient(circle at 80% 0%, rgba(255,255,255,0.25), transparent 60%);
  }
  .hero--video{
    padding-bottom:clamp(20px,4vw,28px);
    background:
      linear-gradient(160deg, rgba(200,77,255,0.92), rgba(168,56,232,0.88) 55%, rgba(120,40,190,0.9)),
      radial-gradient(circle at 80% 0%, rgba(255,255,255,0.25), transparent 60%);
  }

  .hero-top{
    display:flex; align-items:center; justify-content:space-between;
    position:relative; z-index:2;
    margin-bottom:18px;
  }
  .back-btn{
    width:38px; height:38px;
    border-radius:12px;
    background:rgba(255,255,255,0.18);
    border:1px solid rgba(255,255,255,0.3);
    display:flex; align-items:center; justify-content:center;
    color:white;
    cursor:pointer;
    flex-shrink:0;
  }
  .doc-tag{
    font-size:11px;
    font-weight:800;
    letter-spacing:1.3px;
    color:rgba(255,255,255,0.85);
    text-transform:uppercase;
    background:rgba(255,255,255,0.15);
    padding:7px 13px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.25);
  }

  .hero-body{
    display:flex;
    align-items:center;
    gap:16px;
    position:relative; z-index:2;
  }
  .shield-badge, .icon-badge{
    width:60px; height:60px;
    border-radius:18px;
    background: linear-gradient(160deg, rgba(255,255,255,0.95), rgba(255,215,106,0.35));
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 10px 24px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.9);
    flex-shrink:0;
  }
  .icon-badge{ background: linear-gradient(160deg, rgba(255,255,255,0.95), rgba(217,184,255,0.4)); }
  .shield-badge svg{ width:30px; height:30px; }
  .icon-badge svg{ width:28px; height:28px; }

  .hero-body h1{
    color:white;
    font-size:clamp(19px,4.5vw,24px);
    font-weight:800;
    line-height:1.25;
  }
  .hero-body p{
    color:rgba(255,255,255,0.85);
    font-size:clamp(12px,3vw,13.5px);
    margin-top:4px;
  }

  .logo-strip{
    display:flex; align-items:center; gap:10px;
    margin-top:20px;
    position:relative; z-index:2;
    background:rgba(255,255,255,0.14);
    border:1px solid rgba(255,255,255,0.25);
    border-radius:16px;
    padding:10px 13px;
  }
  .logo-strip img{
    width:32px; height:32px;
    border-radius:9px;
    object-fit:cover;
    background:white;
    padding:2px;
  }
  .logo-strip .info{ flex:1; }
  .logo-strip .info b{
    display:block;
    color:white;
    font-size:12.5px;
    font-weight:700;
  }
  .logo-strip .info span{
    color:rgba(255,255,255,0.75);
    font-size:10px;
  }
  .logo-strip .meta{
    color:rgba(255,255,255,0.85);
    font-size:9.5px;
    font-weight:700;
    background:rgba(255,255,255,0.15);
    padding:5px 10px;
    border-radius:10px;
  }

  .screen{
    flex:1;
    overflow-y:auto;
    padding:clamp(20px,5vw,32px) clamp(18px,5vw,32px) 36px;
    background: linear-gradient(180deg, rgba(255,255,255,0.5), rgba(233,213,255,0.3));
    position:relative;
  }

  .intro-text{
    font-size:clamp(12.5px,3vw,14px);
    line-height:1.75;
    color:var(--text);
    opacity:.7;
    margin-bottom:22px;
    padding-bottom:20px;
    border-bottom:1px dashed rgba(150,60,220,0.25);
  }

  .section-label{
    display:flex; align-items:center; gap:10px;
    margin:0 2px 16px 2px;
  }
  .section-label .idx{
    width:22px; height:22px;
    border-radius:6px;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color:white;
    font-size:11px;
    font-weight:800;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .section-label span{
    font-size:11.5px;
    font-weight:700;
    letter-spacing:1.2px;
    text-transform:uppercase;
    color:var(--text);
    opacity:.5;
  }

  .nav-policy-list{
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  a.policy-card{
    text-decoration:none;
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    padding:18px;
    border-radius:22px;
    background: linear-gradient(160deg, rgba(255,255,255,0.68), rgba(233,213,255,0.45));
    border:1px solid rgba(255,255,255,0.85);
    box-shadow: 0 14px 30px rgba(150,60,220,0.2), inset 0 1px 0 rgba(255,255,255,0.8);
    transition: box-shadow .25s ease, transform .2s ease;
    cursor:pointer;
  }
  a.policy-card:hover{
    box-shadow: 0 18px 38px rgba(150,60,220,0.3), inset 0 1px 0 rgba(255,255,255,0.9);
    transform: translateY(-2px);
  }
  a.policy-card:active{ transform: scale(0.98); }

  .policy-icon{
    width:48px; height:48px;
    border-radius:15px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.6), 0 8px 16px rgba(150,60,220,0.25);
  }
  .icon-video{ background: linear-gradient(135deg, var(--primary), var(--secondary)); }
  .icon-audio{ background: linear-gradient(135deg, var(--lavender), var(--primary)); }
  .policy-icon svg{ width:23px; height:23px; }

  .policy-title{ flex:1; min-width:0; }
  .policy-title-row{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  .policy-title h3{
    font-size:clamp(14.5px,3vw,16px);
    font-weight:700;
    color:var(--text);
  }
  .status-pill{
    font-size:9px;
    font-weight:800;
    letter-spacing:.3px;
    text-transform:uppercase;
    padding:3px 8px;
    border-radius:8px;
    background:rgba(255,215,106,0.35);
    color:#8a5a00;
  }
  .policy-title span.sub{
    display:block;
    font-size:clamp(10.5px,2.6vw,12px);
    color:var(--text);
    opacity:.55;
    margin-top:3px;
  }

  .go-arrow{
    width:30px; height:30px;
    border-radius:50%;
    background:rgba(255,255,255,0.7);
    border:1px solid rgba(255,255,255,0.85);
    display:flex; align-items:center; justify-content:center;
    color:var(--primary);
    flex-shrink:0;
  }
  .go-arrow svg{ width:14px; height:14px; }

  .content-card{
    border-radius:22px;
    background: linear-gradient(160deg, rgba(255,255,255,0.68), rgba(233,213,255,0.45));
    border:1px solid rgba(255,255,255,0.85);
    box-shadow: 0 14px 30px rgba(150,60,220,0.2), inset 0 1px 0 rgba(255,255,255,0.8);
    padding:clamp(24px,6vw,40px) clamp(20px,5vw,30px);
    min-height:300px;
    display:flex;
    flex-direction:column;
  }
  #policy-content-audio, #policy-content-video{
    font-size:clamp(12.5px,3vw,14px);
    line-height:1.75;
    color:var(--text);
    align-items:stretch;
    justify-content:flex-start;
    text-align:left;
    width:100%;
    gap:0;
  }

  .policy-block{ width:100%; margin-bottom:26px; }
  .policy-block:last-child{ margin-bottom:0; }

  .policy-h2{
    font-size:clamp(15px,3.6vw,17px);
    font-weight:800;
    color:#6E22C2;
    margin-bottom:14px;
    padding-bottom:8px;
    border-bottom:2px solid var(--lavender);
  }
  .policy-h3{
    display:flex; align-items:center; gap:8px;
    font-size:clamp(13px,3.2vw,14.5px);
    font-weight:700;
    color:var(--primary);
    margin:18px 0 10px;
  }
  .policy-h3 .num{
    display:inline-flex; align-items:center; justify-content:center;
    min-width:22px; height:22px; padding:0 5px;
    border-radius:8px;
    background: linear-gradient(160deg, var(--primary), var(--secondary));
    color:white;
    font-size:11px; font-weight:800;
    flex-shrink:0;
  }
  .policy-block > .policy-h3:first-child{ margin-top:0; }

  .policy-note{
    font-size:clamp(11.5px,2.9vw,13px);
    color:var(--text);
    opacity:.85;
    margin:8px 0 4px;
  }
  .policy-note b{ color:#6E22C2; }

  .policy-table-wrap{
    width:100%;
    overflow:hidden;
    border-radius:14px;
    border:1px solid rgba(200,77,255,0.25);
    margin:10px 0 14px;
    box-shadow: 0 6px 16px rgba(150,60,220,0.12);
  }
  table.policy-table{
    width:100%;
    table-layout:fixed;
    border-collapse:collapse;
    background:rgba(255,255,255,0.6);
    font-size:clamp(10px,2.6vw,12.5px);
  }
  table.policy-table caption{
    caption-side:top;
    text-align:left;
    font-weight:800;
    font-size:clamp(11px,2.8vw,12.5px);
    color:white;
    background: linear-gradient(120deg, var(--primary), var(--secondary));
    padding:9px 14px;
  }
  table.policy-table th{
    background:rgba(233,213,255,0.7);
    color:#5A1C9E;
    font-weight:700;
    text-align:center;
    padding:8px 5px;
    border-bottom:1px solid rgba(200,77,255,0.25);
    white-space:normal;
    word-break:break-word;
    line-height:1.3;
  }
  table.policy-table td{
    padding:7px 5px;
    border-bottom:1px solid rgba(200,77,255,0.12);
    color:var(--text);
    text-align:center;
    white-space:normal;
    word-break:break-word;
    overflow-wrap:break-word;
    line-height:1.4;
  }
  table.policy-table tr:last-child td{ border-bottom:none; }
  table.policy-table tr:nth-child(even) td{ background:rgba(247,139,255,0.06); }
  table.policy-table td:first-child, table.policy-table th:first-child{ text-align:left; padding-left:10px; }
  table.policy-table--dense{ font-size:clamp(9.5px,2.3vw,11px); }
  table.policy-table--dense th, table.policy-table--dense td{ padding:6px 4px; }

  .policy-rules-label{
    font-size:clamp(11.5px,2.9vw,13px);
    font-weight:700;
    color:#6E22C2;
    margin:10px 0 6px;
  }
  ul.policy-list, ol.policy-list{
    list-style:none;
    display:flex; flex-direction:column; gap:8px;
    margin:0 0 8px;
  }
  ul.policy-list li, ol.policy-list li{
    position:relative;
    padding-left:20px;
    font-size:clamp(11.5px,2.9vw,13px);
    line-height:1.6;
  }
  ul.policy-list li::before{
    content:"";
    position:absolute; left:0; top:7px;
    width:7px; height:7px;
    border-radius:50%;
    background: linear-gradient(160deg, var(--primary), var(--secondary));
  }
  ol.policy-list{ counter-reset:pol; }
  ol.policy-list li{ counter-increment:pol; }
  ol.policy-list li::before{
    content:counter(pol);
    position:absolute; left:0; top:0;
    width:16px; height:16px;
    border-radius:6px;
    background: linear-gradient(160deg, var(--primary), var(--secondary));
    color:white;
    font-size:9.5px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
    left:-2px;
  }
  ol.policy-list li{ padding-left:22px; }

  .policy-sub-title{
    font-size:clamp(11px,2.8vw,12.5px);
    font-weight:700;
    color:var(--text);
    text-decoration:underline;
    margin:12px 0 6px;
  }

  .highlight-tag{
    display:inline-block;
    background: var(--gold);
    color:#5A3B00;
    font-weight:800;
    font-size:clamp(14px,3.6vw,17px);
    padding:4px 12px;
    border-radius:8px;
    margin-bottom:14px;
  }

  /* ===== Loading screen ===== */
  #screen-loading.active{ align-items:center; justify-content:center; }
  .loading-card{
    width:100%; max-width:360px; margin:0 auto;
    padding:40px 32px;
    display:flex; flex-direction:column; align-items:center; gap:16px;
    text-align:center;
  }
  .loading-logo{
    width:84px; height:84px;
    border-radius:24px;
    object-fit:cover;
    background:white;
    padding:6px;
    box-shadow: 0 14px 34px rgba(150,60,220,0.35), inset 0 1px 0 rgba(255,255,255,0.7);
  }
  .loading-title{
    font-size:20px;
    font-weight:800;
    color:#4a1c80;
    letter-spacing:.3px;
  }
  .loading-sub{
    font-size:12.5px;
    color:#6E22C2;
    opacity:.75;
    margin-top:-10px;
  }
  .progress-track{
    width:100%;
    height:10px;
    border-radius:20px;
    background:rgba(150,60,220,0.15);
    overflow:hidden;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.12);
    margin-top:6px;
  }
  .progress-fill{
    height:100%;
    width:0%;
    border-radius:20px;
    background: linear-gradient(90deg, var(--primary), var(--secondary), var(--gold));
    transition: width .15s ease-out;
  }
  .progress-text{
    font-size:13px;
    font-weight:800;
    color:#6E22C2;
  }

  /* ===== Language screen ===== */
  #screen-language.active{ align-items:center; justify-content:center; }
  .lang-card{
    width:100%; max-width:380px; margin:0 auto;
    padding:40px 30px;
    display:flex; flex-direction:column; align-items:center; gap:10px;
    text-align:center;
    background: linear-gradient(160deg, rgba(255,255,255,0.75), rgba(233,213,255,0.5));
    border:1px solid rgba(255,255,255,0.9);
    border-radius:28px;
    box-shadow: 0 20px 50px rgba(150,60,220,0.28), inset 0 1px 0 rgba(255,255,255,0.9);
  }
  .lang-logo{
    width:64px; height:64px;
    border-radius:18px;
    object-fit:cover;
    background:white;
    padding:5px;
    box-shadow: 0 10px 24px rgba(0,0,0,0.15);
    margin-bottom:6px;
  }
  .lang-title{ font-size:18px; font-weight:800; color:#4a1c80; }
  .lang-sub{ font-size:12px; color:var(--text); opacity:.6; margin-bottom:14px; }
  .lang-btn{
    width:100%;
    padding:16px;
    border-radius:16px;
    border:1px solid rgba(200,77,255,0.3);
    background: linear-gradient(160deg, rgba(255,255,255,0.9), rgba(255,255,255,0.6));
    color:#4a1c80;
    font-family:inherit;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    transition: transform .15s ease, box-shadow .15s ease;
    box-shadow: 0 6px 16px rgba(150,60,220,0.15);
    display:flex; align-items:center; justify-content:center;
    margin-top:8px;
  }
  .lang-btn:hover{ transform: translateY(-2px); box-shadow: 0 10px 22px rgba(150,60,220,0.25); }
  .lang-btn:active{ transform: scale(0.97); }
  .lang-btn.primary{
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color:white;
    border:none;
  }
  .lang-flag{ font-size:19px; margin-right:9px; }
</style>
</head>
<body>

  <div class="bokeh" style="width:140px;height:140px; top:8%; left:6%;"></div>
  <div class="bokeh" style="width:90px;height:90px; top:70%; left:4%; animation-delay:2s;"></div>
  <div class="bokeh" style="width:110px;height:110px; top:15%; right:6%; animation-delay:1s;"></div>
  <div class="bokeh" style="width:70px;height:70px; top:80%; right:8%; animation-delay:3s;"></div>

  <!-- ===== LOADING SCREEN ===== -->
  <div id="screen-loading" class="app-screen active">
    <div class="loading-card">
      <img id="loadingLogo" class="loading-logo" alt="Rizz Live logo">
      <div class="loading-title">Rizz Live</div>
      <div class="loading-sub">Host Policy &amp; Guidelines</div>
      <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
      <div id="progressText" class="progress-text">0%</div>
    </div>
  </div>

  <!-- ===== LANGUAGE SELECT SCREEN ===== -->
  <div id="screen-language" class="app-screen">
    <div class="lang-card">
      <img id="langLogo" class="lang-logo" alt="Rizz Live logo">
      <div class="lang-title">Select Language</div>
      <div class="lang-sub">Choose your preferred language</div>
      <button class="lang-btn primary" onclick="selectLanguage('en')"><span class="lang-flag">🇺🇸</span> English</button>
      <button class="lang-btn" onclick="selectLanguage('es')"><span class="lang-flag">🇪🇸</span> Español</button>
      <button class="lang-btn" onclick="selectLanguage('pt')"><span class="lang-flag">🇧🇷</span> Português (Brasil)</button>
      <button class="lang-btn" onclick="selectLanguage('ru')"><span class="lang-flag">🇷🇺</span> Русский</button>
      <button class="lang-btn" onclick="selectLanguage('uk')"><span class="lang-flag">🇺🇦</span> Українська</button>
    </div>
  </div>

  <!-- ===== INDEX / HUB SCREEN ===== -->
  <div id="screen-index" class="app-screen">
    <div class="page" id="content-index"></div>
  </div>

  <!-- ===== AUDIO POLICY SCREEN ===== -->
  <div id="screen-audio" class="app-screen">
    <div class="page" id="content-audio"></div>
  </div>

  <!-- ===== VIDEO POLICY SCREEN ===== -->
  <div id="screen-video" class="app-screen">
    <div class="page" id="content-video"></div>

let currentLang = 'en';

function showScreen(name){
  document.querySelectorAll('.app-screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  window.scrollTo(0,0);
}

function openLanguageSelect(){
  showScreen('language');
}

function renderAll(){
  document.getElementById('content-index').innerHTML = T[currentLang].index;
  document.getElementById('content-audio').innerHTML = T[currentLang].audio;
  document.getElementById('content-video').innerHTML = T[currentLang].video;
}

function selectLanguage(lang){
  currentLang = lang;
  renderAll();
  showScreen('index');
}

function startLoading(){
  document.getElementById('loadingLogo').src = LOGO_B64;
  document.getElementById('langLogo').src = LOGO_B64;

  const fill = document.getElementById('progressFill');
  const text = document.getElementById('progressText');
  let p = 0;

  const timer = setInterval(() => {
    p += Math.random() * 9 + 5;
    if (p >= 100) p = 100;
    fill.style.width = p + '%';
    text.textContent = Math.floor(p) + '%';
    if (p >= 100) {
      clearInterval(timer);
      setTimeout(() => { showScreen('language'); }, 400);
    }
  }, 130);
}

window.addEventListener('DOMContentLoaded', startLoading);
